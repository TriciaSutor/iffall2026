<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Five Buttons Design</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Road+Rage&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <h1>Button Styling - Tricia Sutor</h1>
        <main>
            <div class="button_container">
                <a href="https://www.harrypotter.com/" id="pottermore">Pottermore</a>
            </div>
            <div class="button_container">
                <a href="https://thecolorrun.com/" id="colorrun"><span id="word1">The</span> <span id="word2">Color</span> <span id="word3">Run</span></a>
            </div>
            <div class="button_container">
                <a href="https://oldnavy.gap.com/" id="oldnavy">Old Navy</a>
            </div>
            <div class="button_container">
                <a href="https://www.explodingkittens.com/" id="kittens"> Exploding Kittens</a>
            </div>
            <div class="button_container">
                <a href="https://www.mollyjogger.com/" id="mollyjogger">Mollyjogger</a>
            </div>
        </main>
    </body>
</html>
